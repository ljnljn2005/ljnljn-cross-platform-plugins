# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.xlsx-dedup"
name = "收件人表去重统计(姓名+电话+地址)"
version = "0.1.0"
protocol = 2
library = "ljnljn_xlsx_dedup"
memory = "1GiB"
permissions = []

[[analyzer]]
id = "dedup_files"
name = "收件人表去重（选中文件）"
scope = "files"
extensions = ["xlsx", "xlsm", "zip"]
mime_types = [
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  "application/vnd.ms-excel.sheet.macroEnabled.12",
  "application/zip",
]
trigger = "manual"
category = "xlsx"

[[analyzer]]
id = "dedup_evidence"
name = "收件人表去重（遍历检材）"
scope = "evidence"
trigger = "manual"
category = "xlsx"
