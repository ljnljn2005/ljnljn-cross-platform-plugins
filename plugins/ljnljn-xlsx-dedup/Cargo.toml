[package]
name = "ljnljn-xlsx-dedup"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "LovelyCarve LPP v2 analyzer: recipient table (name+phone+address) de-duplication counts"
publish = false

[lib]
name = "ljnljn_xlsx_dedup"
crate-type = ["cdylib", "rlib"]

[dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk" }
# xlsx files are ZIP containers; the v1 layer decodes STORED/DEFLATE members
# itself instead of pulling a full zip crate.
flate2 = "1"
crc32fast = "1"
# Streaming XML reads (workbook/shared strings/styles/worksheets).
quick-xml = "0.41"

[dev-dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk", features = ["testing"] }

[lints.rust]
linker_messages = "allow"

[lints.clippy]
uninlined_format_args = "warn"

[workspace]

[workspace.package]
license = "AGPL-3.0-only"
