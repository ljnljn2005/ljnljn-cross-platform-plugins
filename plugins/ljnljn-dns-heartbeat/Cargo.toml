[package]
name = "ljnljn-dns-heartbeat-periodicity-64075a55"
version = "0.1.0"
edition = "2021"
description = "LovelyCarve file_analyzer: classic pcap DNS query heartbeat periodicity (DNS 查询心跳周期)"
publish = false

[lib]
crate-type = ["cdylib"]
name = "ljnljn_kb_dns_heartbeat_periodicity_64075a55"

[dependencies]
# 真实 SDK crate `lovelycarve-plugin`（LPP v1 / C ABI v1），来自本机已有的
# 官方插件工作区快照 workspaces/_plugin-gen/_sdk（SDK-SOURCE.json 记录：
# LovelyTeams/LovelyCarve-Plugins @ 68d75aebf018ac43add391f2bc83528ca2ee85ae）。
# 该 crate 使用 license.workspace = true，因此依赖指向完整工作区内的 sdk/，
# 由父 Cargo.toml 提供 workspace 继承；SDK 只读引用，未修改。
lovelycarve-plugin = { path = "../../sdk-v1/sdk" }

# 本 crate 的依赖闭包仅来自上面这一条（SDK 自身依赖 rmp-serde/rmpv/serde），
# 用 Cargo.lock 固定版本，配合 `cargo test/build --offline` 离线构建。

[profile.release]
# 与官方插件工作区一致：panic 在 C ABI 边界转成 LPP 错误，需要 unwind。
panic = "unwind"

[lints.rust]
# MSVC link.exe 会为每个 DLL 报告生成的导入库。
linker_messages = "allow"

[lints.clippy]
uninlined_format_args = "warn"

[workspace]

[workspace.package]
license = "AGPL-3.0-only"
