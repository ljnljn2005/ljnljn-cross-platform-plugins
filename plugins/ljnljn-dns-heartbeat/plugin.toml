# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.dns-heartbeat"
name = "DNS 查询心跳周期分析"
version = "0.1.0"
protocol = 2
library = "ljnljn_dns_heartbeat"
memory = "512MiB"
permissions = []

# 首版只支持 classic pcap（.pcap/.cap/.dmp）；pcapng 在运行时报告警而不是被误解析。
[[analyzer]]
id = "dns_heartbeat"
name = "DNS 查询心跳周期分析"
scope = "files"
extensions = ["pcap", "cap", "dmp"]
trigger = "manual"
category = "network"
