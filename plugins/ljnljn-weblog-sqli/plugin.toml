# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.weblog-sqli"
name = "Web 访问日志注入参数检测"
version = "0.1.0"
protocol = 2
library = "ljnljn_weblog_sqli"
memory = "1GiB"
permissions = []

# 单文件：用户在文件列表选中的访问日志。
[[analyzer]]
id = "weblog_files"
name = "Web 访问日志注入参数（单文件）"
scope = "files"
extensions = ["log", "txt"]
trigger = "manual"
category = "web"

# 检材级：遍历每个卷的固定 Web 日志目录。
[[analyzer]]
id = "weblog_evidence"
name = "Web 访问日志注入参数（检材级）"
scope = "evidence"
trigger = "manual"
category = "web"
