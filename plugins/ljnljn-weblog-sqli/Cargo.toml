[package]
name = "ljnljn-weblog-sqli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "LovelyCarve LPP v2 analyzer: Web access-log SQL-injection query-parameter candidates"
publish = false

[lib]
name = "ljnljn_weblog_sqli"
crate-type = ["cdylib", "rlib"]

[dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk" }
# GBK/GB18030 log files emitted by Chinese Web servers.
encoding_rs = "0.8"
# Explainable feature-family matching and the line layout.
regex = "1"

[dev-dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk", features = ["testing"] }

[lints.rust]
linker_messages = "allow"

[lints.clippy]
uninlined_format_args = "warn"

[workspace]

[workspace.package]
license = "AGPL-3.0-only"
