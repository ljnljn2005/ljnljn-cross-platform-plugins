[package]
name = "ljnljn-ewf-header"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "LovelyCarve LPP v2 analyzer: EWF/E01 segment header and section metadata"
publish = false

[lib]
name = "ljnljn_ewf_header"
crate-type = ["cdylib", "rlib"]

[dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk" }
# Real SHA-256 for the file-header digest.
sha2 = "0.10"

[dev-dependencies]
lovelycarve-plugin = { path = "../../sdk-v2/sdk", features = ["testing"] }

[lints.rust]
linker_messages = "allow"

[lints.clippy]
uninlined_format_args = "warn"

[workspace]

[workspace.package]
license = "AGPL-3.0-only"
