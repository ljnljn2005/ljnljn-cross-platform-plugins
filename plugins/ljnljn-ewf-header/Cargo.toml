[package]
name = "ljnljn-ewf-header-metadata-3bcc39e8"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "LovelyCarve 文件分析器：EWF/E01 段级文件头与头部区元数据离线识别"
publish = false

[lib]
# cdylib 供宿主加载；rlib 让 `cargo test` 能链接本 crate 的纯解析单元测试。
name = "ljnljn_kb_ewf_header_metadata_3bcc39e8"
crate-type = ["cdylib", "rlib"]

[dependencies]
# 已核实的官方 SDK crate（name = "lovelycarve-plugin"）。路径指向主项目共享副本
# workspaces/_plugin-gen/_sdk/sdk，来源记录见本工程 SDK-SOURCE.json。
lovelycarve-plugin = { path = "../../sdk-v1/sdk" }
# 结果值序列化为 JSON 文本（宿主 value 只接受标量/数组/映射，不接收二进制）。
serde_json = "1"
# headerSHA256 需要真实 SHA-256；sha2 已在本地 Cargo registry 缓存中，可离线构建。
sha2 = "0.10"

[lints.rust]
# MSVC link.exe 会为每个 DLL 输出 import library 提示。
linker_messages = "allow"

[lints.clippy]
uninlined_format_args = "warn"

# 本工程是独立 workspace 根：不并入上层任何 Cargo 工作区。
[workspace]

[workspace.package]
license = "AGPL-3.0-only"
