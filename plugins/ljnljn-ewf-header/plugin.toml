# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.ewf-header"
name = "EWF/E01 头部元数据"
version = "0.1.0"
protocol = 2
library = "ljnljn_ewf_header"
memory = "256MiB"
permissions = []

# 段级头部元数据：只解析文件头与有界节段窗口，不解压 chunk、不计算流哈希。
[[analyzer]]
id = "ewf_header"
name = "EWF/E01 头部元数据（段级）"
scope = "files"
extensions = ["e01", "ewf"]
trigger = "manual"
category = "disk"
