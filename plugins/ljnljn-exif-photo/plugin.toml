# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.exif-photo"
name = "照片元数据(EXIF/GPS)"
version = "0.1.0"
protocol = 2
library = "ljnljn_exif_photo"
memory = "1GiB"
permissions = []

[[analyzer]]
id = "exif_files"
name = "照片元数据（选中文件）"
scope = "files"
extensions = ["jpg", "jpeg", "png", "heic", "heif"]
mime_types = [
  "image/jpeg",
  "image/png",
  "image/heic",
  "image/heif",
  "application/octet-stream",
]
trigger = "manual"
category = "photo"

[[analyzer.option]]
id = "include_no_exif"
type = "flag"
label = "保留无 EXIF 的照片记录"
default = true

[[analyzer.option]]
id = "max_files"
type = "text"
label = "最多解析照片数（1-20000）"
default = "5000"

[[analyzer]]
id = "exif_evidence"
name = "照片元数据（遍历检材）"
scope = "evidence"
trigger = "manual"
category = "photo"

[[analyzer.option]]
id = "include_no_exif"
type = "flag"
label = "保留无 EXIF 的照片记录"
default = true

[[analyzer.option]]
id = "max_files"
type = "text"
label = "最多解析照片数（1-20000）"
default = "5000"
