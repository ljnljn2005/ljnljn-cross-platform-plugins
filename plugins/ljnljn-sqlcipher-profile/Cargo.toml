[package]
name = "ljnljn-sqlcipher-header-profile-1cb485b2"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "LovelyCarve 文件分析器：SQLCipher 4 / 明文 SQLite 文件头结构指纹与参数画像"
publish = false

[lib]
# crate-type 同时带 rlib：cdylib 供宿主加载，rlib 让 `cargo test` 能链接测试。
name = "ljnljn_kb_sqlcipher_header_profile_1cb485b2"
crate-type = ["cdylib", "rlib"]

[dependencies]
# 已核实的官方 SDK crate（name = "lovelycarve-plugin"）。不做法外依赖：
# 路径来自本机既有共享副本 workspaces/_plugin-gen/_sdk/sdk（来源见 SDK-SOURCE.json）。
lovelycarve-plugin = { path = "../../sdk-v1/sdk" }

[lints.rust]
# MSVC link.exe 会为每个 DLL 输出 import library 提示。
linker_messages = "allow"

[lints.clippy]
uninlined_format_args = "warn"

# 本工程位于插件工作区目录树之内，显式声明自己是独立 workspace 根，
# 避免被上层未知的 Cargo.toml 意外纳入。
[workspace]

[workspace.package]
license = "AGPL-3.0-only"
