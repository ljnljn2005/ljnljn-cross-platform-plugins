# LPP v2 package manifest. Labels are the Chinese defaults; translations live
# in locales/<locale>.toml under stable keys.
id = "org.ljnljn.sqlcipher-profile"
name = "SQLCipher 文件头画像"
version = "0.1.0"
protocol = 2
library = "ljnljn_sqlcipher_profile"
memory = "512MiB"
permissions = []

[[analyzer]]
id = "sqlcipher_header"
name = "SQLCipher 文件头画像（加密参数与 HMAC 试校验）"
scope = "files"
extensions = ["db", "sqlite", "db3", "sqlcipher"]
mime_types = ["application/vnd.sqlite3", "application/x-sqlite3", "application/octet-stream"]
trigger = "manual"
category = "sqlcipher"

# All key material is optional. With no passphrase and no key, the analyzer
# only reports the structural profile and explicitly records
# key_check = not-attempted (no HMAC check is performed).
[[analyzer.option]]
id = "passphrase"
type = "text"
label = "候选口令（留空不试校验）"
default = ""

[[analyzer.option]]
id = "key_hex"
type = "text"
label = "64 位 hex 主密钥（32 字节，留空不试校验）"
default = ""

[[analyzer.option]]
id = "kdf_iter"
type = "text"
label = "KDF 迭代次数"
default = "256000"

[[analyzer.option]]
id = "hmac"
type = "choice"
label = "HMAC 摘要"
default = "sha512"
choices = [
  { id = "sha512", label = "SHA-512（SQLCipher 4 默认）" },
  { id = "sha256", label = "SHA-256" },
]

[[analyzer.option]]
id = "page_offset"
type = "text"
label = "第一页偏移（字节，默认 0）"
default = "0"
